<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam;">
    
    <a-assets>
      <img id="img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Logo_test.png/600px-Logo_test.png">
    </a-assets>

    <a-entity camera>
      <a-image src="#img" position="0 0 -1" width="2"></a-image>
    </a-entity>

  </a-scene>
</body>
</html>
